      <rect x="574" y="383" width="30" height="30"/><rect x="618" y="383" width="30" height="30"/>
      <rect x="574" y="445" width="30" height="30"/><rect x="618" y="445" width="30" height="30"/>
      <rect x="574" y="507" width="30" height="30"/><rect x="618" y="507" width="30" height="30"/>
      <rect x="574" y="569" width="30" height="30"/><rect x="618" y="569" width="30" height="30"/>
      <rect x="574" y="631" width="30" height="30"/><rect x="618" y="631" width="30" height="30"/>
      <rect x="574" y="693" width="30" height="30"/><rect x="618" y="693" width="30" height="30"/>
