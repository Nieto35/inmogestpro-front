  <!-- Nombre: Inmo en marfil, Gest en dorado -->
  <text x="270" y="132"
        font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
        font-size="104" font-weight="700" letter-spacing="-1">
    <tspan fill="#F5F3EE">Inmo</tspan><tspan fill="#C8A84B">Gest</tspan>
  </text>

  <!-- Bajada -->
  <text x="276" y="196"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="29" font-weight="600" letter-spacing="7.5" fill="#9A8B5F">
    PRO · SOFTWARE INMOBILIARIO
